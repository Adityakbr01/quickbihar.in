# ==============================================================================
# QuickBihar VPS Host Nginx Configuration
# Target Path on VPS: /etc/nginx/sites-available/quickbihar.conf
# Symlink Path on VPS: /etc/nginx/sites-enabled/quickbihar.conf
# ==============================================================================

# Upstream Backend API (Bun / Express)
upstream quickbihar_backend {
    server 127.0.0.1:5002;
    keepalive 32;
}

# Upstream Next.js Admin & Seller Web App
upstream quickbihar_web {
    server 127.0.0.1:3002;
    keepalive 32;
}

# Upstream Expo Mobile Web Storefront
upstream quickbihar_mobile {
    server 127.0.0.1:7001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    # Replace with your actual domain or IP when DNS is attached (e.g. quickbihar.in www.quickbihar.in)
    server_name quickbihar.in www.quickbihar.in _;

    # Client payload limit (for image uploads via ImageKit/Multer)
    client_max_body_size 50m;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # --------------------------------------------------------------------------
    # 1. API Routes & Realtime WebSockets -> Backend (Port 5002)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://quickbihar_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location /socket.io/ {
        proxy_pass http://quickbihar_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s; # Long timeout for WebSockets
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # 2. Next.js Dashboard Routes & Static Assets -> Web (Port 3002)
    # --------------------------------------------------------------------------
    location ^~ /_next/ {
        proxy_pass http://quickbihar_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location ~ ^/(admin|seller|delivery)(/.*)?$ {
        proxy_pass http://quickbihar_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # --------------------------------------------------------------------------
    # 3. Expo Mobile Web Storefront (Default Fallthrough) -> Mobile Web (Port 7001)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://quickbihar_mobile;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
