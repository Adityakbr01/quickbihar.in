# ==============================================================================
# QuickBihar Production Nginx Reverse Proxy Configuration
# ==============================================================================
#
# Domains:
#   1. quickbihar.in           -> Customer Real Users App (user-web Vite SPA, port 7001)
#   2. www.quickbihar.in       -> 301 Redirect to https://quickbihar.in
#   3. dashboard.quickbihar.in -> Partner Web App (Admin, Seller, Delivery, port 3002)
#
# Shared Backend:
#   - /api/                    -> Backend REST API (port 5002)
#   - /socket.io/              -> Realtime WebSockets (port 5002)
# ==============================================================================

# Upstream definitions for QuickBihar services
upstream quickbihar_backend {
    server 127.0.0.1:5002;
    keepalive 32;
}

upstream quickbihar_dashboard {
    server 127.0.0.1:3002;
    keepalive 32;
}

upstream quickbihar_customer_app {
    server 127.0.0.1:7001;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# Host-level proxy cache (quickbihar.in + dashboard.quickbihar.in)
# ------------------------------------------------------------------------------
# Why: repeat hits for static assets + public prerendered HTML are served from
# host RAM/disk with ZERO container roundtrip and ZERO backend computation,
# so traffic spikes don't fan out to node/nginx containers or the API.
# Never cached here: /api/*, /socket.io/* (dynamic, per-user, cookie-auth).
#
# ONE-TIME VPS SETUP (required, else nginx fails to start):
#   sudo mkdir -p /var/cache/nginx/qb_static /var/cache/nginx/qb_pages /var/cache/nginx/qb_seo
#   sudo chown -R www-data:www-data /var/cache/nginx   # (or nginx:nginx per distro)
# AFTER EVERY user-web DEPLOY (else stale HTML referencing old hashed assets):
#   sudo rm -rf /var/cache/nginx/qb_pages/*
#   (qb_static is safe to keep — /assets/* filenames are content-hashed.)
# ------------------------------------------------------------------------------
# Sizes are tuned for a 1 GB RAM VPS (total ~35 MB shared memory, ~750 MB max disk).
proxy_cache_path /var/cache/nginx/qb_static levels=1:2 keys_zone=qb_static:20m max_size=512m inactive=30d use_temp_path=off;
proxy_cache_path /var/cache/nginx/qb_pages levels=1:2 keys_zone=qb_pages:10m max_size=200m inactive=60m use_temp_path=off;
proxy_cache_path /var/cache/nginx/qb_seo levels=1:2 keys_zone=qb_seo:5m max_size=50m inactive=2h use_temp_path=off;

# Normalize Accept-Encoding into the cache key so gzip/br/identity variants
# never get mixed (Vary alone is not enough for proxy_cache on open-source nginx).
map $http_accept_encoding $qb_encoding {
    default "";
    ~*"\bbr\b" br;
    ~*"\bgzip\b" gzip;
}

# Private/transactional URL prefixes — mirrors user-web/src/seo/routes.ts
# NOINDEX_PREFIXES. Their shell is identical (/index.html fallback) but caching
# per-URL would explode cache keys (order IDs etc.), so they bypass page cache.
# "0" is falsy for proxy_cache_bypass/proxy_no_cache, "1" bypasses.
map $uri $qb_skip_page_cache {
    default 0;
    ~^/(auth|account|checkout|cart|order|rider|Onboarding)(/|$) 1;
    ~^/clothing/(checkout|cart|account|rider)(/|$) 1;
    ~^/jewelery/(orders|order-detail|order-success|wishlist|notifications|auth|try-on)(/|$) 1;
    ~^/jewelry/(cart|checkout|account|profile|addresses|address-form)(/|$) 1;
}

# ------------------------------------------------------------------------------
# 1. HTTP to HTTPS Redirection (Port 80)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name quickbihar.in www.quickbihar.in dashboard.quickbihar.in;

    # ACME challenge location for Certbot SSL renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Canonical www Redirection (Port 443 HTTPS)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.quickbihar.in;

    ssl_certificate /etc/ssl/certs/quickbihar.pem;
    ssl_certificate_key /etc/ssl/private/quickbihar.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    return 301 https://quickbihar.in$request_uri;
}

# ------------------------------------------------------------------------------
# 3. Real Users Customer App: quickbihar.in (user-web Vite Storefront)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name quickbihar.in;

    ssl_certificate /etc/ssl/certs/quickbihar.pem;
    ssl_certificate_key /etc/ssl/private/quickbihar.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_Customer:10m;
    ssl_session_tickets off;

    client_max_body_size 50m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # REST API endpoints
    location /api/ {
        proxy_pass http://quickbihar_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Realtime WebSockets
    location /socket.io/ {
        proxy_pass http://quickbihar_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 3. Vite hashed assets (immutable, 1-year cache).
    #    Host proxy_cache: repeat hits served from host RAM/disk with no
    #    user-web container roundtrip (absorbs traffic spikes).
    location ^~ /assets/ {
        proxy_pass http://quickbihar_customer_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache qb_static;
        proxy_cache_key "$scheme$host$request_uri$qb_encoding";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status $upstream_cache_status always;
        # NOTE: any location-level add_header disables inheritance of the
        # server-level security headers, so they are repeated here.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # 4. Static files (favicons, manifest, images) — host-cached 7d.
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot)$ {
        proxy_pass http://quickbihar_customer_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache qb_static;
        proxy_cache_key "$scheme$host$request_uri$qb_encoding";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status always;
        # NOTE: any location-level add_header disables inheritance of the
        # server-level security headers, so they are repeated here.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # SEO discovery files (server-owned sitemap index/shards + env-aware robots).
    # Must precede `location /` — otherwise these paths hit the user-web static host.
    # Host-cached 1h: sitemaps hit the backend DB, so caching saves real computation.
    location = /sitemap.xml {
        proxy_pass http://quickbihar_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache qb_seo;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 1h;
        proxy_cache_valid 404 5m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;
        # NOTE: any location-level add_header disables inheritance of the
        # server-level security headers, so they are repeated here.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ~* ^/sitemap-(static|products|taxonomy|malls|locations)\.xml$ {
        proxy_pass http://quickbihar_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache qb_seo;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 1h;
        proxy_cache_valid 404 5m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;
        # NOTE: any location-level add_header disables inheritance of the
        # server-level security headers, so they are repeated here.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /robots.txt {
        proxy_pass http://quickbihar_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache qb_seo;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 1h;
        proxy_cache_valid 404 5m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;
        # NOTE: any location-level add_header disables inheritance of the
        # server-level security headers, so they are repeated here.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 5. user-web Vite Customer Storefront (prerendered HTML + SPA fallback;
    #    the user-web container serves dist/ with try_files $uri $uri/index.html /index.html)
    #    Host page cache: anonymous GETs WITHOUT query string are served from
    #    cache for 5m — no container roundtrip, no computation. Bypassed for:
    #    ?query URLs ($is_args), logged-in users (auth cookies), upgrade
    #    requests, and private prefixes ($qb_skip_page_cache). /api/ +
    #    /socket.io/ above are never cached (dynamic, per-user).
    location / {
        proxy_pass http://quickbihar_customer_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache qb_pages;
        proxy_cache_key "$scheme$host$request_uri$qb_encoding";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_bypass $http_upgrade $is_args $cookie_accessToken $cookie_refreshToken $qb_skip_page_cache;
        proxy_no_cache $is_args $cookie_accessToken $cookie_refreshToken $qb_skip_page_cache;
        add_header X-Cache-Status $upstream_cache_status always;
        # NOTE: any location-level add_header disables inheritance of the
        # server-level security headers, so they are repeated here.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

# ------------------------------------------------------------------------------
# 4. Partner Web App: dashboard.quickbihar.in (Admin, Seller, Delivery Portals)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashboard.quickbihar.in;

    ssl_certificate /etc/ssl/certs/quickbihar.pem;
    ssl_certificate_key /etc/ssl/private/quickbihar.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_Partner:10m;
    ssl_session_tickets off;

    client_max_body_size 50m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # REST API endpoints (Enables first-party relative auth cookies on dashboard domain)
    location /api/ {
        proxy_pass http://quickbihar_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Realtime WebSockets (Live order updates, delivery partner tracking)
    location /socket.io/ {
        proxy_pass http://quickbihar_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Vite Static Cache (hashed build assets, immutable) — host-cached 30d.
    # (Dashboard HTML at `location /` stays uncached on purpose: every viewer
    # is logged in and the origin is just a local static file — cheap.)
    location ^~ /assets/ {
        proxy_pass http://quickbihar_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache qb_static;
        proxy_cache_key "$scheme$host$request_uri$qb_encoding";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status $upstream_cache_status always;
        # NOTE: any location-level add_header disables inheritance of the
        # server-level security headers, so they are repeated here.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        proxy_cache_bypass $http_upgrade;
    }

    # Partner Dashboard SPA (Admin, Seller, Delivery Portals — the
    # web-dash container serves dist/ with an index.html fallback)
    location / {
        proxy_pass http://quickbihar_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
