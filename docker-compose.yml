name: quickbihar

services:
  redis:
    image: redis:alpine
    container_name: quickbihar-redis
    restart: unless-stopped
    volumes:
      - quickbihar-redis-data:/data
    networks:
      - quickbihar-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  server:
    image: ${DOCKER_USER:-adityakbr}/quickbihar-server:prod
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: quickbihar-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:5002:8000"
    environment:
      - PORT=8000
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    env_file:
      - path: ./server/.env
        required: false
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - quickbihar-network
    healthcheck:
      test: ["CMD-SHELL", "bun --version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    image: ${DOCKER_USER:-adityakbr}/quickbihar-web:prod
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: quickbihar-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api/v1
      - NEXT_PUBLIC_SOCKET_URL=/
    env_file:
      - path: ./web/.env
        required: false
    depends_on:
      - server
    networks:
      - quickbihar-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', (res) => process.exit(res.statusCode >= 200 && res.statusCode < 400 ? 0 : 1))\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mobile-web:
    image: ${DOCKER_USER:-adityakbr}/quickbihar-mobile-web:prod
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: quickbihar-mobile-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:7001:80"
    env_file:
      - path: ./mobile/.env
        required: false
    depends_on:
      - server
    networks:
      - quickbihar-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  quickbihar-redis-data:
    name: quickbihar-redis-data

networks:
  quickbihar-network:
    name: quickbihar-network
    driver: bridge
