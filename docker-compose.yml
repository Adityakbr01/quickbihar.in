services:
  server:
    image: ${DOCKER_USER:-adityakbr}/quickbihar-server:prod
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: quickbihar-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:5002:8000"
    environment:
      - PORT=8000
      - NODE_ENV=production
    env_file:
      - path: ./server/.env
        required: false
    networks:
      - quickbihar-network
    healthcheck:
      test: ["CMD-SHELL", "bun --version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    image: ${DOCKER_USER:-adityakbr}/quickbihar-web:prod
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: quickbihar-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api/v1
      - NEXT_PUBLIC_SOCKET_URL=/
    env_file:
      - path: ./web/.env
        required: false
    depends_on:
      - server
    networks:
      - quickbihar-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  mobile-web:
    image: ${DOCKER_USER:-adityakbr}/quickbihar-mobile-web:prod
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: quickbihar-mobile-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:7001:80"
    env_file:
      - path: ./mobile/.env
        required: false
    depends_on:
      - server
    networks:
      - quickbihar-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  quickbihar-network:
    name: quickbihar-network
    driver: bridge
