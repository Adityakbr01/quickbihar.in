services:
  redis:
    image: redis:alpine
    container_name: quickbihar-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    restart: always

  server:
    image: ${DOCKER_USER:-adityakbr}/quickbihar-server:prod
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: quickbihar-server
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    env_file:
      - ./server/.env
    depends_on:
      - redis
    restart: always

  web:
    image: ${DOCKER_USER:-adityakbr}/quickbihar-web:prod
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: quickbihar-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api/v1
      - NEXT_PUBLIC_SOCKET_URL=/
    env_file:
      - ./web/.env
    depends_on:
      - server
    restart: always

volumes:
  redis-data:
