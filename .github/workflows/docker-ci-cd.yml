name: Deploy QuickBihar Production

on:
  push:
    branches:
      - master
      - main

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: server
            context: ./server
            file: ./server/Dockerfile
            image: quickbihar-server
          - name: web
            context: ./dash-web
            file: ./dash-web/Dockerfile
            image: quickbihar-web
          - name: mobile-web
            context: ./mobile
            file: ./mobile/Dockerfile
            image: quickbihar-mobile-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build & Push Image (${{ matrix.service.name }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          push: true
          build-args: |
            VITE_API_URL=/api/v1
            VITE_SOCKET_URL=/
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID || '183149129805-vf8pkq6h066lcapjanjv1271g36jvij4.apps.googleusercontent.com' }}
            EXPO_PUBLIC_API_ORIGIN=https://quickbihar.in
          tags: |
            ${{ secrets.DOCKER_USER }}/${{ matrix.service.image }}:prod
            ${{ secrets.DOCKER_USER }}/${{ matrix.service.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  deploy:
    name: Deploy to VPS (Self-Hosted Runner)
    needs: build-and-push
    runs-on:
      - self-hosted
      - quickbihar

    env:
      APP_DIR: /home/ubuntu/apps/quickbihar
      COMPOSE_FILE: docker-compose.yml

    steps:
      - name: Checkout repo on VPS runner
        uses: actions/checkout@v4

      - name: Sync codebase to ~/apps/quickbihar
        run: |
          mkdir -p ${{ env.APP_DIR }}
          # Sync files to ~/apps/quickbihar while strictly preserving existing .env files
          rsync -av --exclude='.git' --exclude='*.env' ./ ${{ env.APP_DIR }}/

      - name: Ensure Environment Files Exist
        run: |
          cd ${{ env.APP_DIR }}
          mkdir -p server web mobile dash-web
          touch server/.env web/.env mobile/.env dash-web/.env

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Pull latest images
        run: |
          cd ${{ env.APP_DIR }}
          docker compose -f ${{ env.COMPOSE_FILE }} pull

      - name: Deploy containers with zero-downtime recreation
        run: |
          cd ${{ env.APP_DIR }}
          docker compose -f ${{ env.COMPOSE_FILE }} up -d --remove-orphans

      - name: Verify running services
        run: |
          cd ${{ env.APP_DIR }}
          docker compose -f ${{ env.COMPOSE_FILE }} ps

      - name: Cleanup unused Docker images
        run: |
          docker image prune -f
