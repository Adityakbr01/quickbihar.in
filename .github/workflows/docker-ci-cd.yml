name: Deploy QuickBihar Production

on:
  push:
    branches:
      - master
      - main

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    env:
      SERVER_TAG: ${{ secrets.DOCKER_USER }}/quickbihar-server:prod
      WEB_TAG: ${{ secrets.DOCKER_USER }}/quickbihar-web:prod
      MOBILE_WEB_TAG: ${{ secrets.DOCKER_USER }}/quickbihar-mobile-web:prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      # ---------------- SERVER ----------------
      - name: Build & Push Server Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.SERVER_TAG }}
            ${{ secrets.DOCKER_USER }}/quickbihar-server:${{ github.sha }}

      # ---------------- WEB ----------------
      - name: Build & Push Web Image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_TAG }}
            ${{ secrets.DOCKER_USER }}/quickbihar-web:${{ github.sha }}

      # ---------------- MOBILE WEB ----------------
      - name: Build & Push Mobile Web Image
        uses: docker/build-push-action@v6
        with:
          context: ./mobile
          file: ./mobile/Dockerfile
          push: true
          tags: |
            ${{ env.MOBILE_WEB_TAG }}
            ${{ secrets.DOCKER_USER }}/quickbihar-mobile-web:${{ github.sha }}

  deploy:
    name: Deploy to VPS (Self-Hosted Runner)
    needs: build-and-push
    runs-on:
      - self-hosted
      - quickbihar

    env:
      APP_DIR: /home/ubuntu/apps/quickbihar
      COMPOSE_FILE: docker-compose.yml

    steps:
      - name: Checkout repo on VPS runner
        uses: actions/checkout@v4

      - name: Sync codebase to ~/apps/quickbihar
        run: |
          mkdir -p ${{ env.APP_DIR }}
          # Sync files to ~/apps/quickbihar while strictly preserving any existing .env files
          rsync -av --exclude='.git' --exclude='*.env' ./ ${{ env.APP_DIR }}/

      - name: Ensure Environment Files Exist in ~/apps/quickbihar
        run: |
          cd ${{ env.APP_DIR }}
          mkdir -p server web mobile
          touch server/.env web/.env mobile/.env

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Pull latest images
        run: |
          cd ${{ env.APP_DIR }}
          docker compose -f ${{ env.COMPOSE_FILE }} pull

      - name: Deploy containers with zero-downtime recreation
        run: |
          cd ${{ env.APP_DIR }}
          docker compose -f ${{ env.COMPOSE_FILE }} up -d --remove-orphans

      - name: Verify running services
        run: |
          cd ${{ env.APP_DIR }}
          docker compose -f ${{ env.COMPOSE_FILE }} ps

      - name: Cleanup unused Docker images
        run: |
          docker image prune -f
