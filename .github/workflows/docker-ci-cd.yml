name: Deploy QuickBihar Production

on:
  push:
    branches:
      - master
      - main

env:
  # Kept for the self-hosted deploy job, which intentionally still uses one
  # node20-era action (actions/checkout@v4) until that runner is confirmed
  # >= v2.327.1 (node24 minimum). Harmless for the node24 build job below.
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  # ── Stage 1: server image ──────────────────────────────────────
  # user-web's prerender manifest is generated at BUILD time by fetching the
  # live catalog API, so web images must only build AFTER the new server is
  # deployed and healthy (see deploy-server → build-web dependency chain).
  build-server:
    name: Build & Push (server)
    # Pinned to 24.04: ubuntu-latest migrates to Ubuntu 26 (Oct 2026) and we
    # don't want a surprise base-image change mid-release. Revisit yearly.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build & Push Image (server)
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USER }}/quickbihar-server:prod
            ${{ secrets.DOCKER_USER }}/quickbihar-server:${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  # ── Stage 2: server deploy + health gate ───────────────────────
  deploy-server:
    name: Deploy server to VPS (Self-Hosted Runner)
    needs: build-server
    runs-on:
      - self-hosted
      - quickbihar

    env:
      APP_DIR: /home/ubuntu/apps/quickbihar
      COMPOSE_FILE: docker-compose.yml

    steps:
      - name: Checkout repo on VPS runner
        uses: actions/checkout@v4

      - name: Sync codebase to ~/apps/quickbihar
        run: |
          mkdir -p ${{ env.APP_DIR }}
          # Sync files to ~/apps/quickbihar while strictly preserving existing .env files
          rsync -av --exclude='.git' --exclude='*.env' ./ ${{ env.APP_DIR }}/

      - name: Ensure Environment Files Exist
        run: |
          cd ${{ env.APP_DIR }}
          mkdir -p server mobile dash-web user-web
          touch server/.env mobile/.env dash-web/.env

      - name: Ensure host nginx cache dirs
        run: |
          # Idempotent one-time setup — required by vps-nginx/quickbihar.conf
          # (proxy_cache_path). Uses sudo -n so a missing NOPASSWD rule fails
          # fast with a clear error instead of hanging on a password prompt.
          sudo -n mkdir -p /var/cache/nginx/qb_static /var/cache/nginx/qb_pages /var/cache/nginx/qb_seo
          sudo -n chown -R www-data:www-data /var/cache/nginx

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Pull + recreate server only
        run: |
          cd ${{ env.APP_DIR }}
          docker compose -f ${{ env.COMPOSE_FILE }} pull server
          docker compose -f ${{ env.COMPOSE_FILE }} up -d --no-deps server
          docker compose -f ${{ env.COMPOSE_FILE }} ps server

      - name: Wait for new server + catalog API (manifest gate)
        run: |
          # user-web bakes the catalog into static HTML at BUILD time by
          # calling this same public API. Nothing downstream builds until the
          # freshly deployed server answers with real catalog data — a stale
          # or down API here used to bake stale pages into user-web.
          echo "waiting for https://quickbihar.in/api/v1/ ..."
          for i in $(seq 1 36); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://quickbihar.in/api/v1/ || true)
            if [ "$CODE" = "200" ]; then echo "server live after ${i}x5s"; break; fi
            sleep 5
          done
          [ "$CODE" = "200" ] || { echo "server did not come up"; exit 1; }
          curl -s "https://quickbihar.in/api/v1/products/public?vertical=CLOTHING&limit=1" \
            | grep -q '"success":true' || { echo "catalog API unhealthy — refusing to build web images"; exit 1; }
          echo "catalog API healthy — web builds may start"

  # ── Stage 3: web images (only after the new server is live) ───
  build-web:
    name: Build & Push (${{ matrix.service.name }})
    needs: deploy-server
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: web-dash
            context: ./dash-web
            file: ./dash-web/Dockerfile
            image: quickbihar-web-dash
          - name: user-web
            context: ./user-web
            file: ./user-web/Dockerfile
            image: quickbihar-user-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build & Push Image (${{ matrix.service.name }})
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          push: true
          build-args: |
            VITE_API_URL=/api/v1
            VITE_SOCKET_URL=/
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID || '183149129805-vf8pkq6h066lcapjanjv1271g36jvij4.apps.googleusercontent.com' }}
            VITE_API_ORIGIN=https://quickbihar.in
            VITE_GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID || '183149129805-vf8pkq6h066lcapjanjv1271g36jvij4.apps.googleusercontent.com' }}
          tags: |
            ${{ secrets.DOCKER_USER }}/${{ matrix.service.image }}:prod
            ${{ secrets.DOCKER_USER }}/${{ matrix.service.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  # ── Stage 4: web deploy ───────────────────────────────────────
  deploy-web:
    name: Deploy web to VPS (Self-Hosted Runner)
    needs: build-web
    runs-on:
      - self-hosted
      - quickbihar

    env:
      APP_DIR: /home/ubuntu/apps/quickbihar
      COMPOSE_FILE: docker-compose.yml

    steps:
      - name: Checkout repo on VPS runner
        uses: actions/checkout@v4

      - name: Sync codebase to ~/apps/quickbihar
        run: |
          mkdir -p ${{ env.APP_DIR }}
          # Sync files to ~/apps/quickbihar while strictly preserving existing .env files
          rsync -av --exclude='.git' --exclude='*.env' ./ ${{ env.APP_DIR }}/

      - name: Ensure Environment Files Exist
        run: |
          cd ${{ env.APP_DIR }}
          mkdir -p server mobile dash-web user-web
          touch server/.env mobile/.env dash-web/.env

      - name: Ensure host nginx cache dirs
        run: |
          # Idempotent one-time setup — required by vps-nginx/quickbihar.conf
          # (proxy_cache_path). Uses sudo -n so a missing NOPASSWD rule fails
          # fast with a clear error instead of hanging on a password prompt.
          sudo -n mkdir -p /var/cache/nginx/qb_static /var/cache/nginx/qb_pages /var/cache/nginx/qb_seo
          sudo -n chown -R www-data:www-data /var/cache/nginx

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Pull latest images
        run: |
          cd ${{ env.APP_DIR }}
          docker compose -f ${{ env.COMPOSE_FILE }} pull

      - name: Deploy containers with zero-downtime recreation
        run: |
          cd ${{ env.APP_DIR }}
          # Server was already rolled in deploy-server with the same images;
          # compose recreates only what changed (the fresh web images).
          docker compose -f ${{ env.COMPOSE_FILE }} up -d --remove-orphans

      - name: Sync host nginx config (only when changed)
        run: |
          NEW_FILE="${{ env.APP_DIR }}/vps-nginx/quickbihar.conf"
          LIVE_FILE="/etc/nginx/sites-available/quickbihar.conf"
          NEW_HASH=$(sha256sum "$NEW_FILE" | cut -d' ' -f1)
          OLD_HASH=$(sudo -n sha256sum "$LIVE_FILE" 2>/dev/null | cut -d' ' -f1 || echo missing)
          if [ "$NEW_HASH" = "$OLD_HASH" ]; then
            echo "host nginx config unchanged — no reload needed"
            exit 0
          fi
          echo "host nginx config changed — deploying with backup"
          sudo -n cp "$LIVE_FILE" "$LIVE_FILE.bak.prev" || true
          sudo -n cp "$NEW_FILE" "$LIVE_FILE"
          if ! sudo -n nginx -t; then
            echo "nginx -t FAILED — restoring backup"
            sudo -n cp "$LIVE_FILE.bak.prev" "$LIVE_FILE" || true
            exit 1
          fi
          sudo -n systemctl reload nginx
          echo "host nginx reloaded"

      - name: Purge page cache (fresh HTML after deploy)
        run: |
          # qb_pages holds prerendered HTML referencing hashed /assets/*.
          # A deploy changes those hashes, so drop the zone every time.
          # (qb_static is content-hashed — safe to keep across deploys.)
          sudo -n rm -rf /var/cache/nginx/qb_pages/* || true
          echo "page cache purged"

      - name: Purge SEO cache (fresh robots/sitemap after deploy)
        run: |
          # qb_seo host-caches /robots.txt + /sitemap*.xml for 1h.
          # Without this purge, crawlers keep seeing the previous release's
          # robots/sitemap for up to an hour after every deploy.
          sudo -n rm -rf /var/cache/nginx/qb_seo/* || true
          echo "seo cache purged"

      - name: Verify running services
        run: |
          cd ${{ env.APP_DIR }}
          docker compose -f ${{ env.COMPOSE_FILE }} ps

      - name: Verify site + cache (MISS then HIT)
        run: |
          echo "--- 1st request (expect MISS) ---"
          curl -s -o /dev/null -D - https://quickbihar.in/ | grep -i "x-cache-status\|HTTP/" || true
          echo "--- 2nd request (expect HIT) ---"
          curl -s -o /dev/null -D - https://quickbihar.in/ | grep -i "x-cache-status\|HTTP/" || true
          echo "--- hard gate: homepage body must be non-empty (0-byte html once blanked prod) ---"
          HOMEPAGE_BYTES=$(curl -s https://quickbihar.in/ | wc -c)
          echo "homepage bytes: $HOMEPAGE_BYTES"
          if [ "$HOMEPAGE_BYTES" -lt 5000 ]; then
            echo "FATAL: homepage served $HOMEPAGE_BYTES bytes (<5000). Origin dist is corrupt — check .gz artifacts and container files."
            exit 1
          fi
          GZIP_BYTES=$(curl -s -H "Accept-Encoding: gzip" --output /tmp/home.gz -w "%{size_download}" https://quickbihar.in/)
          echo "homepage gz bytes: $GZIP_BYTES"
          if [ "$GZIP_BYTES" -lt 2000 ]; then
            echo "FATAL: gz-served homepage only $GZIP_BYTES bytes (<2000). gzip_static artifacts in the image are empty."
            exit 1
          fi
          echo "--- backend API ---"
          curl -s -o /dev/null -w "api status: %{http_code}\n" https://quickbihar.in/api/v1/ || true
          echo "--- sitemap product URLs (should match live catalog) ---"
          curl -s https://quickbihar.in/sitemap-products.xml | grep -c "<loc>" || true

      - name: Cleanup unused Docker images
        run: |
          docker image prune -f
