# Container nginx for the Vite SPA (listens on 3000 to match compose mapping).
# Mirrors mobile/nginx.conf conventions: immutable hashed assets + fallback.
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Hashed Vite build assets — immutable, cache for a year.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Static files with cache-busting-friendly long cache.
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # SPA fallback — every other route serves index.html so
    # react-router can resolve /admin/*, /seller/* and /delivery/*.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry document (it references hashed assets).
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }
}
