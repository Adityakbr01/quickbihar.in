    rel="stylesheet" />
  <script>
    // Apply the stored theme before first paint (mirrors next-themes:
    // storageKey "theme", default follows the OS).
    // Prevents a dark/light flash while the bundle loads.
    try {
      var s = localStorage.getItem("theme") || "system";
      var d = s === "dark" || (s === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", d);
      document.documentElement.style.colorScheme = d ? "dark" : "light";
    } catch (e) {}
  </script>
</head>

  <script type="module" src="/src/main.tsx"></script>
