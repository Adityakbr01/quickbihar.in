<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#80C314" />
    <!-- API origin + image CDN (banners, product/mall images are served
         from ImageKit). Preconnect cuts a handshake round-trip off LCP
         discovery; dns-prefetch covers browsers that ignore preconnect.
         No Google Fonts in this app (system stack) so there is nothing
         render-blocking to defer here. -->
    <link rel="preconnect" href="https://quickbihar.in" crossorigin />
    <link rel="dns-prefetch" href="https://quickbihar.in" />
    <link rel="preconnect" href="https://ik.imagekit.io" crossorigin />
    <link rel="dns-prefetch" href="https://ik.imagekit.io" />
    <!-- NOTE: keep this shell minimal (no description/canonical/OG/robots).
         Per-route head tags are injected at build time by src/seo/prerender.tsx
         and at runtime by <SeoRouter /> (react-helmet-async). Duplicating them
         here would emit TWO canonicals on prerendered pages. -->
    <title>QuickBihar — Online Shopping in Bihar</title>
    <!-- First-paint loader (spinner only): visible until React createRoot
         commits and replaces #root. Covers non-prerendered routes
         (account/checkout/...) that fall back to this shell. -->
    <style id="qb-boot-css">#qb-boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#ffffff;z-index:9999}#qb-boot .qb-ring{width:46px;height:46px;border-radius:50%;border:4px solid #ecfccb;border-top-color:#65a30d;animation:qb-spin .9s cubic-bezier(.5,.15,.5,.85) infinite}@keyframes qb-spin{to{transform:rotate(360deg)}}</style>
  </head>
  <body>
    <!-- NOTE: #root children are REPLACED (prepended over) by prerender Shell
         output on prerendered pages, and every fallback serves dist/index.html
         (also prerendered) — so the boot loader always comes from Shell.
         Only <noscript> lives here permanently. -->
    <div id="root">
      <noscript>
        <p style="font-family:system-ui,sans-serif;text-align:center;padding:40px 16px">Please enable JavaScript to continue.</p>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
