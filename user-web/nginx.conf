# Container nginx for user-web (Vite SPA + vite-prerender-plugin SSG).
# Listens on 80 to match compose mapping 127.0.0.1:7001:80.
# Mirrors dash-web/nginx.conf conventions + prerender-aware fallback.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static-file performance: zero-copy sendfile + fd/stat cache so repeat
    # hits are served from kernel page cache without disk I/O or recomputation.
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    open_file_cache max=2000 inactive=30s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    # Serve precompressed .gz emitted by vite-plugin-compression when possible.
    gzip_static on;

    # Hashed Vite build assets — immutable, cache for a year.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Static files with cache-busting-friendly long cache.
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Prerendered SEO pages + SPA fallback.
    # vite-prerender-plugin emits dist/product/<slug>/index.html,
    # dist/mall/<slug>/index.html, etc. — $uri/index.html serves those
    # directly; everything else falls back to /index.html for react-router.
    location / {
        try_files $uri $uri/index.html $uri.html /index.html;
    }

    # Never cache the entry document (it references hashed assets).
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }
}
