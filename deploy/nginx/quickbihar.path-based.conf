# Path-based deployment for a single-domain Oracle VPS.
#
# Intended routing:
# - /                         -> Expo Web storefront static files
# - /admin, /seller, /delivery -> Next.js dashboard container
# - /_next                     -> Next.js dashboard assets
# - /api/v1, /socket.io        -> Express/Bun API container
#
# Replace quickbihar.in and upstream names/ports with your VPS values.

upstream quickbihar_api {
    server 127.0.0.1:8000;
}

upstream quickbihar_dashboard {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name quickbihar.in www.quickbihar.in;

    # Expo web export output, for example mobile/dist mounted or copied here.
    root /var/www/quickbihar-storefront;
    index index.html;

    client_max_body_size 20m;

    location ^~ /api/v1/ {
        proxy_pass http://quickbihar_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /socket.io/ {
        proxy_pass http://quickbihar_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /_next/ {
        proxy_pass http://quickbihar_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(admin|seller|delivery)(/.*)?$ {
        proxy_pass http://quickbihar_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Expo Router static export fallback for direct visits like /mall or /product/...
    location / {
        try_files $uri $uri/ /index.html;
    }
}
