server {
  listen 80;
  root /usr/share/nginx/html;

  # 1. Expo Web Static Assets - 1-Year Immutable Cache
  location /_expo/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
  }

  # 2. Static media files & icons
  location ~* \.(ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
  }

  # 3. Static SEO Pages First, fallback to dynamic rewriting
  location / {
    try_files $uri $uri.html $uri/index.html @dynamic;
  }

  # 4. Dynamic routing fallback for client-hydrated routes
  location @dynamic {
    rewrite ^/product/.+ /product/[id].html last;
    rewrite ^/mall/.+ /mall/[id].html last;
    rewrite ^/category/.+ /category/[slug].html last;
    try_files $uri /index.html;
  }

  # 5. 404 handler
  error_page 404 /+not-found.html;
}
