server {
  listen 80;
  listen [::]:80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # 1. Expo Web Static Assets - 1-Year Immutable Cache
  location /_expo/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
  }

  # 2. Static media files & icons
  location ~* \.(ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
  }

  # 3. Static SEO Pages — expo export --platform web generates one HTML file per route.
  #    Each product/mall/category/location slug gets its own index.html at build time.
  #    try_files: exact file → directory index → html file → 404
  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }

  # 4. Private / functional routes — client-rendered shells with noindex.
  #    Expo Router static export emits index.html inside each directory, so
  #    /account/index.html, /auth/index.html, etc. exist in dist/.
  #    These location blocks ensure deep-links like /account/profile resolve correctly.
  location /account      { try_files $uri $uri/index.html /account/index.html =404; }
  location /auth         { try_files $uri $uri/index.html /auth/index.html =404; }
  location /checkout     { try_files $uri $uri/index.html /checkout/index.html =404; }
  location /order-detail { try_files $uri $uri/index.html /order-detail/index.html =404; }
  location /order-success{ try_files $uri $uri/index.html /order-success/index.html =404; }
  location /track-order  { try_files $uri $uri/index.html /track-order/index.html =404; }
  location /rider        { try_files $uri $uri/index.html /rider/index.html =404; }
  location /Onboarding   { try_files $uri $uri/index.html /Onboarding/index.html =404; }

  # 5. 404 handler
  error_page 404 /+not-found.html;
}
